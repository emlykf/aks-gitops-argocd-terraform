apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Resources to include (everything from base/ plus this environment's namespace)
resources:
  - ../../base
  - namespace.yaml

# Target namespace for all resources of this environment
namespace: 3tirewebapp-prod

# Image tags per environment (lets you test a new version in dev before prod)
images:
  - name: piyushsachdeva/frontend
    newTag: v2
  - name: piyushsachdeva/backend
    newTag: latest
  - name: postgres
    newTag: "15"

replicas:
  - name: frontend
    count: 3
  - name: backend
    count: 3
  - name: postgres
    count: 1